name: CI

# Sibling of deploy.yml, which owns publishing. This workflow only checks; it never
# builds an artifact for Pages, never touches the `pages` concurrency group, and holds
# no secrets. The hourly cron that refreshes /music lives in deploy.yml and is not
# duplicated here.
#
# The checks live in 10ax/ci-common (tag v1, node.yml). Warnings, not gates.
# No NEXT_PUBLIC_* values on purpose: the build must work without them (the /music
# page falls back to a static list, site-url falls back to the Pages origin).
#
# The lane reports this check as `ci / verify` — the ruleset's required check was
# renamed from `verify` to match, so merges stay gated the way they were.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: 10ax/ci-common/.github/workflows/node.yml@v1
    with:
      # Node-only suite under v8 coverage; scope and thresholds (90) live in
      # vitest.config.ts so they are visible and reviewable in the repo.
      coverage: pnpm run test:coverage
