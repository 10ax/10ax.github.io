name: Deploy to GitHub Pages

on:
  # Build & deploy on every push to the default branch.
  push:
    branches: [master]
  # Hourly rebuild so /music refreshes from Last.fm
  schedule:
    - cron: "0 * * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs when a newer commit lands; let scheduled runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Before setup-node: `cache: pnpm` needs pnpm on PATH to find the store.
      # No `version` input — it is read from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Same .node-version as ci.yml: 22, the floor pnpm 11 requires.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Only Next's own build cache: the dependency store is cached by setup-node
      # above (`cache: pnpm`), so caching it twice would just cost upload time.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://10ax.github.io' }}
          NEXT_PUBLIC_LASTFM_API_KEY: ${{ secrets.NEXT_PUBLIC_LASTFM_API_KEY }}
          NEXT_PUBLIC_LASTFM_USER: ${{ secrets.NEXT_PUBLIC_LASTFM_USER }}
        run: pnpm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
